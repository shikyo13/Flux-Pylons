pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

includeBuild("../ZeroMods-Core") {
    dependencySubstitution { substitute module("com.zeromods:zeromods-core-forge-1.20.1") using project(":forge-1.20.1") }
}
