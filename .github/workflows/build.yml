name: Build and GameTest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        forge-version: ['47.4.10']
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.13.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.3'
          cache: pip
          cache-dependency-path: requirements-assets.txt

      - name: Install pinned asset dependencies
        run: python -m pip install --requirement requirements-assets.txt

      - name: Install pinned FFmpeg 8.0.1 build
        run: |
          archive="$RUNNER_TEMP/ffmpeg-8.0.1.tar.xz"
          ffmpeg_dir="$RUNNER_TEMP/ffmpeg-8.0.1"
          curl --fail --location --output "$archive" \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-11-30-12-53/ffmpeg-n8.0.1-17-g27a297f186-linux64-lgpl-8.0.tar.xz
          printf '%s  %s\n' b4f4eff9dbcb2ca45c95ef3b812f29d4ec5cf732b1f6b39b0c8d41eb8a281e6e "$archive" | sha256sum --check
          mkdir -p "$ffmpeg_dir"
          tar -xJf "$archive" --directory "$ffmpeg_dir" --strip-components=2 \
            --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          "$ffmpeg_dir/ffmpeg" -version
          "$ffmpeg_dir/ffmpeg" -hide_banner -encoders | grep -w libvorbis
          echo "$ffmpeg_dir" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify generated data is committed
        run: |
          ./gradlew --no-daemon -Pforge_version=${{ matrix.forge-version }} runData
          git diff --exit-code -- src/generated

      - name: Build and verify release JAR
        run: ./gradlew --no-daemon -Pforge_version=${{ matrix.forge-version }} clean build

      - name: Run Forge GameTests
        run: ./gradlew --no-daemon -Pforge_version=${{ matrix.forge-version }} runGameTestServer

      - name: Upload release JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flux-pylons-forge-${{ matrix.forge-version }}-${{ github.sha }}
          path: build/libs/flux-pylons-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload GameTest log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gametest-log-forge-${{ matrix.forge-version }}-${{ github.sha }}
          path: run/logs/latest.log
          if-no-files-found: ignore
          retention-days: 14
