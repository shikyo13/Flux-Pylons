plugins {
    id 'fabric-loom' version '1.10.5'
}
version = mod_version
group = mod_group_id
base.archivesName = 'flux-pylons-fabric-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
    include modApi('teamreborn:energy:4.1.0')
    modImplementation 'maven.modrinth:forge-config-api-port:N5qzq0XV'
    runtimeOnly 'com.electronwill.night-config:core:3.8.0'
    runtimeOnly 'com.electronwill.night-config:toml:3.8.0'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
fabricApi {
    configureDataGeneration {
        outputDirectory = file('src/generated/resources')
        strictValidation = false
    }

}
loom {
    runs {
        server { server(); programArg '--nogui' }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar {
    includeEmptyDirs = false
    exclude '.cache/**'
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE_quantumflux.txt' } }
    from('TEMPLATE_LICENSE.txt') { into 'META-INF'; rename { 'LICENSE_NEOFORGED_MDK_TEMPLATE.txt' } }
}

dependencies { include(modImplementation('com.zeromods:zeromods-core-fabric-1.21.1:0.1.2')) }
