plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Add only repositories required by declared dependencies. Forge and
    // ModDevGradle supply their own repositories.
}

base {
    archivesName = mod_archive_name
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Minecraft 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Plain JVM codec tests use the rebuilt Forge classes on local machines and CI.
    enable {
        forgeVersion = "${project.minecraft_version}-${project.forge_version}"
        disableRecompilation = false
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Unit-style protocol tests need the transformed Minecraft/Forge classes
// supplied to the main runtime by ModDevGradle.
sourceSets.test.compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
sourceSets.test.runtimeClasspath += sourceSets.test.output + sourceSets.test.compileClasspath

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_homepage           : mod_homepage,
            mod_issue_tracker      : mod_issue_tracker,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

var releaseModId = project.mod_id.toString()
tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    exclude '.cache/**'
    exclude 'com/zerotheabsolute/quantumflux/gametest/**'
    exclude '**/*GameTests*.class', '**/PylonHudPreview*.class', '**/integration/**'
    exclude 'data/quantumflux/structures/empty.nbt'
    manifest {
        attributes([
                'Specification-Title'  : mod_id,
                'Specification-Vendor' : mod_authors,
                'Specification-Version': mod_version,
                'Implementation-Title' : mod_name,
                'Implementation-Vendor': mod_authors,
                'Implementation-Version': mod_version
        ])
    }

    from('LICENSE') {
        into 'META-INF'
        rename { "LICENSE_${releaseModId}.txt" }
    }
    from('TEMPLATE_LICENSE.txt') {
        into 'META-INF'
        rename { 'LICENSE_NEOFORGED_MDK_TEMPLATE.txt' }
    }
}

var generatedMetadataFile = layout.buildDirectory.file(
        'generated/sources/modMetadata/META-INF/mods.toml')
var expectedMetadataEntries = [
        "loaderVersion=\"${project.loader_version_range}\"",
        "license=\"${project.mod_license}\"",
        "modId=\"${project.mod_id}\"",
        "version=\"${project.mod_version}\"",
        "displayName=\"${project.mod_name}\"",
        "displayURL=\"${project.mod_homepage}\"",
        "issueTrackerURL=\"${project.mod_issue_tracker}\"",
        "versionRange=\"${project.forge_version_range}\"",
        "versionRange=\"${project.minecraft_version_range}\""
]
var verifyModMetadata = tasks.register('verifyModMetadata') {
    dependsOn tasks.named('generateModMetadata')
    group = 'verification'
    description = 'Validates the expanded Forge metadata used by the release JAR'
    inputs.file(generatedMetadataFile)

    doLast {
        var metadata = generatedMetadataFile.get().asFile
        if (!metadata.isFile()) {
            throw new GradleException("Generated Forge metadata not found: ${metadata}")
        }

        var text = metadata.getText('UTF-8')
        if (text.contains('${')) {
            throw new GradleException('Generated Forge metadata contains an unresolved placeholder')
        }

        var missingEntries = expectedMetadataEntries.findAll { !text.contains(it) }
        if (!missingEntries.isEmpty()) {
            throw new GradleException(
                    "Generated Forge metadata is missing: ${missingEntries.join(', ')}")
        }
    }
}

var allocatorTest = tasks.register('allocatorTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Runs deterministic FE allocation regression and property checks'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zerotheabsolute.quantumflux.energy.ProportionalEnergyAllocatorTest'
    jvmArgs '-ea'
}

var fairDeliveryTest = tasks.register('fairDeliveryTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies shared-pool fairness, rejected shares, native increments, and cycle limits'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zerotheabsolute.quantumflux.energy.FairEnergyDistributorTest'
    jvmArgs '-ea'
}

var passwordVerifierTest = tasks.register('passwordVerifierTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Runs password verifier format, migration, and rejection regression checks'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zerotheabsolute.quantumflux.util.QFPasswordVerifierTest'
    jvmArgs '-ea'
}

var networkCodecTest = tasks.register('networkCodecTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Runs bounded payload, stable identity, and client-cache regressions'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zerotheabsolute.quantumflux.network.NetworkCodecTest'
    jvmArgs '-ea'
}

var pythonExecutable = providers.gradleProperty('pythonExecutable')
        .orElse(providers.environmentVariable('PYTHON'))
        .getOrElse('python')

var textureComparisonTest = tasks.register('textureComparisonTest', Exec) {
    group = 'verification'
    description = 'Checks that PNG compression differences preserve strict pixel and metadata validation'
    workingDir projectDir
    commandLine pythonExecutable, '-m', 'unittest', 'discover', '-s', 'tools', '-p', 'test_generate_textures.py'
}

var verifyTextures = tasks.register('verifyTextures', Exec) {
    dependsOn textureComparisonTest
    group = 'verification'
    description = 'Regenerates textures in memory and rejects asset or model-reference drift'
    workingDir projectDir
    commandLine pythonExecutable, 'tools/generate_textures.py', '--check'
}

var verifySounds = tasks.register('verifySounds', Exec) {
    group = 'verification'
    description = 'Regenerates audio and rejects encoded asset or manifest drift'
    workingDir projectDir
    commandLine pythonExecutable, 'tools/generate_sounds.py', '--check'
}

var verifyTranslations = tasks.register('verifyTranslations', Exec) {
    dependsOn tasks.named('processResources')
    group = 'verification'
    description = 'Rejects missing, duplicate, or unsynchronized concrete translation keys'
    workingDir projectDir
    commandLine pythonExecutable, 'tools/validate_translations.py'
}

var verifyGeneratedAssets = tasks.register('verifyGeneratedAssets') {
    dependsOn verifyTextures, verifySounds, verifyTranslations
    group = 'verification'
    description = 'Runs deterministic texture, audio, and localization checks'
}

var releaseJarFile = tasks.named('reobfJar', Jar).flatMap { it.archiveFile }
var verifyReleaseJar = tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('reobfJar'), verifyModMetadata
    group = 'verification'
    description = 'Validates required metadata, license, and entrypoint files in the release JAR'
    inputs.file(releaseJarFile)

    doLast {
        var jarFile = releaseJarFile.get().asFile
        var requiredEntries = [
                'META-INF/mods.toml',
                'pack.mcmeta',
                "META-INF/LICENSE_${releaseModId}.txt",
                'META-INF/LICENSE_NEOFORGED_MDK_TEMPLATE.txt',
                'com/zerotheabsolute/quantumflux/QuantumFlux.class'
        ]

        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            var developmentEntries = archive.entries().findAll {
                it.name.contains('/gametest/') || it.name.contains('GameTests')
                        || it.name.contains('PylonHudPreview') || it.name.contains('/integration/')
                        || it.name.contains('/performance/') || it.name.startsWith('data/quantumflux_performance/')
                        || it.name == 'data/quantumflux/structures/empty.nbt'
            }
            if (!developmentEntries.isEmpty()) {
                throw new GradleException('Release JAR contains development fixtures: ' + developmentEntries)
            }
            var invalidResourceEntries = archive.entries().findAll {
                var parts = it.name.split('/')
                parts.length >= 2 && (parts[0] == 'assets' || parts[0] == 'data')
                        && !(parts[1] ==~ /[a-z0-9_.-]+/)
            }
            if (!invalidResourceEntries.isEmpty()) {
                throw new GradleException('Release JAR contains invalid resource namespaces: ' + invalidResourceEntries)
            }
            var missingEntries = requiredEntries.findAll { archive.getEntry(it) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException(
                        "Release JAR is missing: ${missingEntries.join(', ')}")
            }

            var metadataEntry = archive.getEntry('META-INF/mods.toml')
            var metadataText = archive.getInputStream(metadataEntry).getText('UTF-8')
            if (metadataText.contains('${')) {
                throw new GradleException('Release JAR contains unresolved Forge metadata')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn allocatorTest, fairDeliveryTest, passwordVerifierTest, networkCodecTest,
            verifyModMetadata, verifyGeneratedAssets
}

tasks.named('build').configure {
    dependsOn verifyReleaseJar
}

// ModDevGradle can return success even when Minecraft aborts during startup.
// Validate the actual dedicated-server log whenever runServer exits.
var dedicatedServerLog = layout.projectDirectory.file('run/logs/latest.log')
var dedicatedServerStartMarker = layout.buildDirectory.file('tmp/runServer/start-marker.txt')
var verifyDedicatedServerLog = tasks.register('verifyDedicatedServerLog') {
    group = 'verification'
    description = 'Fails unless the latest dedicated-server log reached the ready state without a fatal error'

    doLast {
        var logFile = dedicatedServerLog.asFile
        if (!logFile.isFile()) {
            throw new GradleException("Dedicated-server log not found: ${logFile}")
        }

        var startMarker = dedicatedServerStartMarker.get().asFile
        if (startMarker.isFile() && logFile.lastModified() < startMarker.lastModified()) {
            throw new GradleException(
                    "Dedicated-server log was not updated by the latest run; inspect ${logFile}")
        }

        var logText = logFile.getText('UTF-8')
        var fatalMarkers = [
                '/FATAL]',
                'Failed to start the minecraft server',
                'Attempted to load class',
                'Exception caught from launcher'
        ]
        var fatalMarker = fatalMarkers.find { logText.contains(it) }
        if (fatalMarker != null) {
            throw new GradleException(
                    "Dedicated server reported a fatal startup error (${fatalMarker}); inspect ${logFile}")
        }

        var reachedReadyState = logText.readLines().any {
            it.contains('[Server thread/INFO]') && it.contains('Done (')
        }
        if (!reachedReadyState) {
            throw new GradleException(
                    "Dedicated server never reached its ready state; inspect ${logFile}")
        }
    }
}

tasks.named('runServer').configure {
    // JavaExec otherwise receives an empty input stream, which prevents a
    // headless operator or CI harness from issuing a graceful `stop` command.
    standardInput = System.in

    doFirst {
        var marker = dedicatedServerStartMarker.get().asFile
        marker.parentFile.mkdirs()
        marker.setText(Long.toString(System.currentTimeMillis()), 'UTF-8')
    }
    finalizedBy verifyDedicatedServerLog
}

var gameTestServerLog = layout.projectDirectory.file('run/logs/latest.log')
var gameTestServerStartMarker = layout.buildDirectory.file('tmp/runGameTestServer/start-marker.txt')
var verifyGameTestServerLog = tasks.register('verifyGameTestServerLog') {
    group = 'verification'
    description = 'Fails unless a fresh GameTest run completes with all required tests passing'

    doLast {
        var logFile = gameTestServerLog.asFile
        if (!logFile.isFile()) {
            throw new GradleException("GameTest server log not found: ${logFile}")
        }

        var startMarker = gameTestServerStartMarker.get().asFile
        if (startMarker.isFile() && logFile.lastModified() < startMarker.lastModified()) {
            throw new GradleException(
                    "GameTest server log was not updated by the latest run; inspect ${logFile}")
        }

        var logText = logFile.getText('UTF-8')
        var completion = logText =~ /All (\d+) required tests passed/
        if (!completion.find() || Integer.parseInt(completion.group(1)) < 1) {
            throw new GradleException(
                    "GameTest success marker not found; inspect ${logFile}")
        }

        var fatalMarkers = [
                '/FATAL]',
                'Failed to start the minecraft server',
                'Attempted to load class',
                'Exception caught from launcher'
        ]
        var fatalMarker = fatalMarkers.find { logText.contains(it) }
        if (fatalMarker != null) {
            throw new GradleException(
                    "GameTest server reported a fatal startup error (${fatalMarker}); inspect ${logFile}")
        }
    }
}

tasks.named('runGameTestServer').configure {
    doFirst {
        var marker = gameTestServerStartMarker.get().asFile
        marker.parentFile.mkdirs()
        marker.setText(Long.toString(System.currentTimeMillis()), 'UTF-8')
    }
    finalizedBy verifyGameTestServerLog
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
