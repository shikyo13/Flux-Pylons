plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = mod_version
group = mod_group_id
base.archivesName = mod_archive_name
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    reobf = false
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
tasks.named('processResources') { dependsOn tasks.named('compileJava') }
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net'; metadataSources { mavenPom(); artifact() } } }
        filter { includeGroup 'org.lwjgl' }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_homepage           : mod_homepage,
            mod_issue_tracker      : mod_issue_tracker,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

var releaseModId = project.mod_id.toString()
tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    exclude '.cache/**'
    manifest {
        attributes([
                'Specification-Title'  : mod_id,
                'Specification-Vendor' : mod_authors,
                'Specification-Version': mod_version,
                'Implementation-Title' : mod_name,
                'Implementation-Vendor': mod_authors,
                'Implementation-Version': mod_version
        ])
    }

    from('LICENSE') {
        into 'META-INF'
        rename { "LICENSE_${releaseModId}.txt" }
    }
    from('TEMPLATE_LICENSE.txt') {
        into 'META-INF'
        rename { 'LICENSE_NEOFORGED_MDK_TEMPLATE.txt' }
    }
}
